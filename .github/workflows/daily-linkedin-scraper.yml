name: Daily LinkedIn Job Scraper

on:
  schedule:
    # Runs every 30 minutes, between 07:00 am and 09:00 am german local time
    - cron: "*/30 7-9 * * *"
  workflow_dispatch:

permissions:
  contents: write # Required to push updated CSV/log files back to the repo

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Job Scraper
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python job_scraper.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add --ignore-errors Job_Scraper/ *.log || true
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Update scraped jobs"
            git push
          else
            echo "No changes to commit"
          fi
