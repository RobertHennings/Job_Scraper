name: Daily LinkedIn Job Scraper

on:
  schedule:
    - cron: "12,42 * * * *" # Runs twice an hour at :12 and :42 (avoids peak queue drops)
  workflow_dispatch:

permissions:
  contents: write # Required to push updated CSV/log files back to the repo

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Job Scraper
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python job_scraper.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add linkedin_jobs.csv *.log
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update scraped jobs" && git push)
