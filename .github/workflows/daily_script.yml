name: Daily LinkedIn Job Scraper

on:
  schedule:
    - cron: "*/5 * * * *" # Every 5 minutes
    # Runs every day at 07:13 UTC (08:13 CET / 09:13 CEST in Germany)
    - cron: "13 7 * * *"
    # Temporary control run at 10:20 CET (09:20 UTC)
    - cron: "20 9 * * *"
    - cron: "10 9 * * *"
  workflow_dispatch:

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome (for Selenium/Browser scraping)
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Job Scraper
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python job_scraper.py
